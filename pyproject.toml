[project]
name = "osm2ns3"
version = "1.0.0"
description = "FastAPI service converting OpenStreetMap files to NS-3 mobility traces via the SUMO toolchain"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.128.8",
    "pydantic~=2.13.4",
    "pydantic-settings~=2.5",
    "aiofiles~=25.1.0",
    "python-multipart~=0.0.20",
    "uvicorn[standard]~=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "httpx~=0.28",
    "pytest-cov~=5.0",
    "asgi-lifespan~=2.1",
    "ruff~=0.8",
    "black~=24.0",
    "isort~=5.13",
]

[tool.black]
# Default line length (88); a one-time reformat established this baseline.
extend-exclude = '(\.venv|\.venv312|jobs|uploads|outputs|frontend|static|\.github/scripts)'

[tool.isort]
profile = "black"
extend_skip = [".venv", ".venv312", "jobs", "uploads", "outputs", "frontend", "static", ".github/scripts"]

[tool.ruff]
extend-exclude = [".venv", ".venv312", "jobs", "uploads", "outputs", "frontend", "static", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI: Depends() in argument defaults is the documented pattern
    "B011",  # tests: assert False to fail a try/except branch
    "B904",  # raise-without-from inside FastAPI exception paths
    "B905",  # zip() strict= is 3.10+ noise for our usage
    "E501",  # line length left to black's 88
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app", "main"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
